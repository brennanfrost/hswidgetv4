<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSCL Preview Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e8e8e8; font-family: sans-serif; min-height: 100vh; }
  #upload-section { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; padding: 20px; }
  #design-section { display: none; padding: 16px; }
  input[type=file] { display: none; }
  .upload-btn { background: #c8102e; color: #fff; padding: 18px 40px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: inline-block; text-align: center; }
  #main-img { width: 100%; border-radius: 8px; display: block; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .wrap { position: relative; }
  h1 { font-size: 1.5rem; color: #fff; text-align: center; }
  p { color: #777; text-align: center; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="upload-section">
  <h1>High-Strung Christmas Lights</h1>
  <p>Upload a photo of your home to get started</p>
  <label class="upload-btn" for="fileInput">
    📷 Choose Photo
  </label>
  <input type="file" id="fileInput" accept="image/*">
</div>

<div id="design-section">
  <div class="wrap" id="wrap">
    <img id="main-img" alt="Your home">
    <canvas id="canvas"></canvas>
  </div>
</div>

<script>
document.getElementById('fileInput').addEventListener('change', function() {
  var file = this.files[0];
  if (!file) return;
  
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('main-img');
    img.onload = function() {
      var canvas = document.getElementById('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      document.getElementById('upload-section').style.display = 'none';
      document.getElementById('design-section').style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});
</script>
</body>
</html>
